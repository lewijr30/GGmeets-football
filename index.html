  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070B13; }
    ::-webkit-scrollbar-thumb { background: #1E2D4A; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #00E676; }
  </style>
</head>
<body class="bg-[#070B13] text-slate-100 antialiased selection:bg-[#00E676] selection:text-black min-h-screen pb-20 md:pb-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Supabase Credentials
    const supabaseUrl = 'https://uwlikbqmkaduuwtcpeek.supabase.co';
    const supabaseAnonKey = 'sb_publishable_whLnQ_SyNKvr53fJGu56cA_4kMp_707';
    const supabase = window.supabase?.createClient ? window.supabase.createClient(supabaseUrl, supabaseAnonKey) : null;

    // Local Payment Details for Addis Ababa
    const PAYMENT_INFO = {
      Telebirr: {
        accountNumber: "0911234567",
        displayName: "0911 234 567",
        receiver: "Lewi Mastewal",
        note: "Add your full name in the Telebirr transfer remarks."
      },
      CBE: {
        accountNumber: "1000123456789",
        displayName: "1000 1234 56789",
        receiver: "Lewi Mastewal",
        note: "Commercial Bank of Ethiopia (CBE Birr / Mobile Banking)"
      }
    };

    // Default Matches
    const DEFAULT_GAMES = [
      {
        id: "1",
        title: "5-a-side Sunset Match",
        event_type: "5-a-side",
        date: "Today",
        time: "5:00 PM - 6:30 PM",
        location: "Bole Atlas Pitch, Addis Ababa",
        price: 150,
        total_spots: 10,
        booked_spots: 7,
        image_url: "https://images.unsplash.com/photo-1529900748604-07564a03e7a6?w=700",
        description: "Fast-paced artificial turf game. Bibs and drinking water provided. Bring turf shoes (no metal studs).",
        amenities: ["Artificial Turf", "Bibs Provided", "Drinking Water", "Parking Available"]
      },
      {
        id: "2",
        title: "Full Field 11v11 Match",
        event_type: "Full Field",
        date: "Tomorrow",
        time: "6:30 PM - 8:30 PM",
        location: "Meskel Square Field, Addis Ababa",
        price: 200,
        total_spots: 22,
        booked_spots: 18,
        image_url: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=700",
        description: "Full 90-minute friendly match with dedicated referee. Great stamina and team play expected.",
        amenities: ["Refereed", "Showers", "Floodlights", "Locker Room"]
      },
      {
        id: "3",
        title: "7-a-side Weekend Warmup",
        event_type: "7-a-side",
        date: "Saturday",
        time: "8:00 AM - 9:30 AM",
        location: "Sarbet Pitch (Near Vatican), Addis Ababa",
        price: 180,
        total_spots: 14,
        booked_spots: 10,
        image_url: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=700",
        description: "Morning competitive pickup game. Fresh air, good passing football, and morning coffee after match.",
        amenities: ["Artificial Turf", "Bibs Provided", "Café Nearby"]
      }
    ];

    const DEFAULT_BOOKINGS = [
      {
        id: "b-101",
        event_id: "1",
        match_title: "5-a-side Sunset Match",
        player_name: "Yared Tadesse",
        player_phone: "0911 88 99 00",
        amount: 150,
        payment_method: "Telebirr",
        status: "pending",
        screenshot_url: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=600",
        submitted_at: "10 mins ago"
      }
    ];

    function App() {
      const [currentView, setCurrentView] = useState('home');
      const [adminTab, setAdminTab] = useState('approvals');
      const [approvalFilter, setApprovalFilter] = useState('all');

      const [events, setEvents] = useState(() => {
        const local = localStorage.getItem('gg_events');
        return local ? JSON.parse(local) : DEFAULT_GAMES;
      });

      const [bookings, setBookings] = useState(() => {
        const local = localStorage.getItem('gg_bookings');
        return local ? JSON.parse(local) : DEFAULT_BOOKINGS;
      });

      const [userProfile, setUserProfile] = useState(() => {
        const local = localStorage.getItem('gg_profile');
        return local ? JSON.parse(local) : {
          name: "Lewi Mastewal",
          phone: "+251 91 234 5678",
          position: "Midfielder",
          neighborhood: "Bole, Addis Ababa",
          avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200",
          rating: 4.9
        };
      });

      const [activeCategory, setActiveCategory] = useState('All');
      const [searchQuery, setSearchQuery] = useState('');

      const [selectedEvent, setSelectedEvent] = useState(null);
      const [detailModalEvent, setDetailModalEvent] = useState(null);
      const [bookingModalOpen, setBookingModalOpen] = useState(false);
      const [receiptFilePreview, setReceiptFilePreview] = useState(null);
      const [paymentMethod, setPaymentMethod] = useState('Telebirr');
      const [isSubmittingBooking, setIsSubmittingBooking] = useState(false);
      const [viewReceiptModal, setViewReceiptModal] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      useEffect(() => {
        localStorage.setItem('gg_events', JSON.stringify(events));
      }, [events]);

      useEffect(() => {
        localStorage.setItem('gg_bookings', JSON.stringify(bookings));
      }, [bookings]);

      useEffect(() => {
        localStorage.setItem('gg_profile', JSON.stringify(userProfile));
      }, [userProfile]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3200);
      };

      const handleCopyText = (text, label) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
          showToast(`📋 Copied ${label} account number!`);
        }
      };

      const handleFileUpload = (e, callback) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 6 * 1024 * 1024) {
          alert("File size exceeds 6MB. Please upload a smaller image.");
          return;
        }
        const reader = new FileReader();
        reader.onloadend = () => callback(reader.result);
        reader.readAsDataURL(file);
      };

      const handleClientBookingSubmit = async (e) => {
        e.preventDefault();
        if (!receiptFilePreview) {
          alert("Please upload your transfer screenshot.");
          return;
        }

        setIsSubmittingBooking(true);

        const newBookingRecord = {
          id: 'b-' + Date.now(),
          event_id: selectedEvent.id,
          match_title: selectedEvent.title,
          match_date: selectedEvent.date,
          match_time: selectedEvent.time,
          match_location: selectedEvent.location,
          player_name: userProfile.name,
          player_phone: userProfile.phone,
          amount: selectedEvent.price,
          payment_method: paymentMethod,
          status: 'pending',
          screenshot_url: receiptFilePreview,
          submitted_at: 'Just now'
        };

        if (supabase) {
          try {
            await supabase.from('bookings').insert([{
              event_id: selectedEvent.id,
              player_name: userProfile.name,
              player_phone: userProfile.phone,
              payment_method: paymentMethod,
              screenshot_url: receiptFilePreview,
              status: 'pending'
            }]);
          } catch (err) {
            console.warn("Supabase record insert:", err);
          }
        }

        setBookings([newBookingRecord, ...bookings]);
        setIsSubmittingBooking(false);
        setBookingModalOpen(false);
        setReceiptFilePreview(null);
        showToast("⚽ Receipt submitted! Admin will verify your spot.");
        setCurrentView('my-tickets');
      };

      const handleUpdatePaymentStatus = async (bookingId, eventId, newStatus) => {
        setBookings(prev => prev.map(b => b.id === bookingId ? { ...b, status: newStatus } : b));

        if (newStatus === 'approved') {
          setEvents(prev => prev.map(ev => {
            if (ev.id === eventId) {
              const currentBooked = ev.booked_spots || 0;
              return { ...ev, booked_spots: Math.min(ev.total_spots, currentBooked + 1) };
            }
            return ev;
          }));
          showToast("✅ Payment Approved & spot allocated!");
        } else if (newStatus === 'rejected') {
          showToast("❌ Payment rejected.");
        }

        if (supabase) {
          try {
            await supabase.from('bookings').update({ status: newStatus }).eq('id', bookingId);
          } catch (err) {
            console.warn(err);
          }
        }
      };

      const handleDeleteMatch = (id) => {
        if (confirm("Are you sure you want to remove this match?")) {
          setEvents(events.filter(e => e.id !== id));
          showToast("🗑️ Match listing removed.");
        }
      };

      const filteredEvents = useMemo(() => {
        return events.filter(event => {
          const matchesCategory = activeCategory === 'All' || event.event_type === activeCategory;
          const matchesSearch = 
            event.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            event.location.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });
      }, [events, activeCategory, searchQuery]);

      const filteredAdminBookings = useMemo(() => {
        if (approvalFilter === 'all') return bookings;
        return bookings.filter(b => b.status === approvalFilter);
      }, [bookings, approvalFilter]);

      const myBookings = useMemo(() => {
        return bookings.filter(b => b.player_phone === userProfile.phone || b.player_name === userProfile.name);
      }, [bookings, userProfile]);

      const pendingCount = bookings.filter(b => b.status === 'pending').length;

      return (
        <div className="flex flex-col min-h-screen text-slate-100">
          
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-[#00E676] text-black font-extrabold px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Header */}
          <header className="sticky top-0 z-40 backdrop-blur-xl bg-[#070B13]/90 border-b border-[#162032]">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              
              <div 
                onClick={() => setCurrentView('home')} 
                className="flex items-center space-x-3 cursor-pointer group"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#00E676] to-emerald-400 flex items-center justify-center shadow-lg shadow-[#00E676]/20 transition-transform group-hover:scale-105">
                  <span className="text-black font-extrabold text-xl">⚽</span>
                </div>
                <div className="flex flex-col">
                  <span className="font-extrabold text-xl tracking-tight text-white leading-none">
                    GG<span className="text-[#00E676]">meets</span>
                  </span>
                  <span className="text-[10px] text-slate-400 font-semibold tracking-wider uppercase">Addis Ababa</span>
                </div>
              </div>

              {/* Desktop Nav */}
              <nav className="hidden md:flex items-center space-x-6 text-sm font-semibold">
                <button 
                  onClick={() => setCurrentView('home')} 
                  className={`${currentView === 'home' ? 'text-[#00E676] border-b-2 border-[#00E676]' : 'text-slate-400 hover:text-white'} py-2 transition`}
                >
                  Home
                </button>
                <button 
                  onClick={() => setCurrentView('events')} 
                  className={`${currentView === 'events' ? 'text-[#00E676] border-b-2 border-[#00E676]' : 'text-slate-400 hover:text-white'} py-2 transition`}
                >
                  Pickup Matches
                </button>
                <button 
                  onClick={() => setCurrentView('my-tickets')} 
                  className={`${currentView === 'my-tickets' ? 'text-[#00E676] border-b-2 border-[#00E676]' : 'text-slate-400 hover:text-white'} py-2 flex items-center gap-1.5 transition`}
                >
                  <span>My Passes</span>
                  {myBookings.length > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full text-[10px] bg-[#00E676]/20 text-[#00E676] font-bold">
                      {myBookings.length}
                    </span>
                  )}
                </button>
                <button 
                  onClick={() => setCurrentView('admin')} 
                  className={`${currentView === 'admin' ? 'text-[#00E676] border-b-2 border-[#00E676]' : 'text-amber-400 hover:text-amber-300'} py-2 flex items-center gap-1.5 transition`}
                >
                  <span>🛡️ Host Admin</span>
                  {pendingCount > 0 && (
                    <span className="w-5 h-5 bg-red-500 text-white rounded-full text-[10px] flex items-center justify-center font-bold animate-pulse">
                      {pendingCount}
                    </span>
                  )}
                </button>
              </nav>

              <div 
                onClick={() => setCurrentView('profile')} 
                className="flex items-center space-x-3 p-1.5 pr-3 rounded-full bg-[#111A2E] border border-[#1E2D4A] hover:border-[#00E676]/50 cursor-pointer transition"
              >
                <img src={userProfile.avatar} alt="Profile" className="w-8 h-8 rounded-full object-cover border border-[#00E676]/50" />
                <span className="text-xs font-bold text-white hidden sm:inline">{userProfile.name.split(' ')[0]}</span>
              </div>
            </div>
          </header>

          {/* Mobile Bottom Navigation */}
          <div className="fixed bottom-0 left-0 right-0 z-40 bg-[#0A0F1D]/95 backdrop-blur-lg border-t border-[#1A263D] flex justify-around items-center py-2.5 md:hidden">
            <button onClick={() => setCurrentView('home')} className={`flex flex-col items-center text-[10px] font-semibold ${currentView === 'home' ? 'text-[#00E676]' : 'text-slate-400'}`}>
              <span className="text-lg">🏠</span>
              <span>Home</span>
            </button>
            <button onClick={() => setCurrentView('events')} className={`flex flex-col items-center text-[10px] font-semibold ${currentView === 'events' ? 'text-[#00E676]' : 'text-slate-400'}`}>
              <span className="text-lg">⚽</span>
              <span>Matches</span>
            </button>
            <button onClick={() => setCurrentView('my-tickets')} className={`flex flex-col items-center text-[10px] font-semibold relative ${currentView === 'my-tickets' ? 'text-[#00E676]' : 'text-slate-400'}`}>
              <span className="text-lg">🎟️</span>
              <span>Passes</span>
              {myBookings.length > 0 && <span className="absolute -top-1 right-2 w-2 h-2 rounded-full bg-[#00E676]"></span>}
            </button>
            <button onClick={() => setCurrentView('admin')} className={`flex flex-col items-center text-[10px] font-semibold relative ${currentView === 'admin' ? 'text-[#00E676]' : 'text-amber-400'}`}>
              <span className="text-lg">🛡️</span>
              <span>Admin</span>
              {pendingCount > 0 && <span className="absolute -top-1 right-2 w-4 h-4 bg-red-500 text-white rounded-full text-[9px] flex items-center justify-center font-bold">{pendingCount}</span>}
            </button>
            <button onClick={() => setCurrentView('profile')} className={`flex flex-col items-center text-[10px] font-semibold ${currentView === 'profile' ? 'text-[#00E676]' : 'text-slate-400'}`}>
              <span className="text-lg">👤</span>
              <span>Profile</span>
            </button>
          </div>

          {/* HOME VIEW */}
          {currentView === 'home' && (
            <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-12 lg:py-20 flex flex-col justify-center">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                <div className="lg:col-span-7 space-y-6">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#00E676]/10 border border-[#00E676]/30 text-[#00E676] text-xs font-extrabold uppercase tracking-wider">
                    <span>⚡ Addis Ababa Pickup Football</span>
                  </div>
                  
                  <h1 className="text-4xl sm:text-6xl font-extrabold text-white tracking-tight leading-[1.1]">
                    Play Footy Tonight. <br />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#00E676] via-emerald-300 to-teal-400">
                      No Hassle. Pure Ball.
                    </span>
                  </h1>

                  <p className="text-slate-400 text-base sm:text-lg max-w-xl leading-relaxed">
                    Join vetted daily pickup games across Bole, Meskel Square, Sarbet, and CMC. Pay via Telebirr or CBE, attach your screenshot, and get verified immediately by the match host.
                  </p>

                  <div className="flex flex-wrap gap-4 pt-4">
                    <button 
                      onClick={() => setCurrentView('events')}
                      className="px-8 py-4 rounded-2xl bg-[#00E676] text-black font-extrabold text-sm hover:bg-[#00c965] shadow-xl shadow-[#00E676]/25 transition transform active:scale-95"
                    >
                      Browse Upcoming Games →
                    </button>
                    <button 
                      onClick={() => setCurrentView('my-tickets')}
                      className="px-6 py-4 rounded-2xl bg-[#111A2E] text-white font-bold text-sm border border-[#1E2D4A] hover:bg-[#16233B] transition"
                    >
                      View My Registered Passes
                    </button>
                  </div>

                  <div className="grid grid-cols-3 gap-4 pt-6 border-t border-[#162032] max-w-lg">
                    <div>
                      <h4 className="text-2xl font-extrabold text-white">350+</h4>
                      <p className="text-xs text-slate-400">Players in Addis</p>
                    </div>
                    <div>
                      <h4 className="text-2xl font-extrabold text-[#00E676]">Fast</h4>
                      <p className="text-xs text-slate-400">Instant Verification</p>
                    </div>
                    <div>
                      <h4 className="text-2xl font-extrabold text-white">Daily</h4>
                      <p className="text-xs text-slate-400">Turf & 11v11 Matches</p>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-5 relative">
                  <div className="relative rounded-3xl overflow-hidden border border-[#1E2D4A] bg-[#0E1526] shadow-2xl">
                    <img 
                      src="https://images.unsplash.com/photo-1518091043644-c1d4457512c6?w=900" 
                      alt="Turf Football Field" 
                      className="object-cover h-[440px] w-full"
                    />
                    <div className="absolute bottom-0 inset-x-0 p-6 bg-gradient-to-t from-black/90 via-black/60 to-transparent">
                      <p className="text-xs font-bold text-[#00E676] uppercase">Next Match</p>
                      <h3 className="text-lg font-bold text-white">Bole Atlas Sunset Turf</h3>
                      <p className="text-xs text-slate-300">Today at 5:00 PM • 150 ETB</p>
                    </div>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* EVENTS FEED */}
          {currentView === 'events' && (
            <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                  <h2 className="text-3xl font-extrabold text-white">Daily Football Matches</h2>
                  <p className="text-slate-400 text-sm mt-1">Select a game, complete mobile payment, and receive your pitch pass.</p>
                </div>

                <div className="relative w-full md:w-80">
                  <span className="absolute left-3.5 top-3 text-slate-400">🔍</span>
                  <input 
                    type="text" 
                    placeholder="Search pitch or location (e.g. Bole)..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#0E1526] border border-[#1E2D4A] text-white text-xs focus:border-[#00E676] focus:outline-none"
                  />
                </div>
              </div>

              <div className="flex gap-2 overflow-x-auto pb-4 mb-6">
                {['All', '5-a-side', '7-a-side', 'Full Field'].map((cat) => (
                  <button
                    key={cat}
                    onClick={() => setActiveCategory(cat)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${
                      activeCategory === cat 
                        ? 'bg-[#00E676] text-black shadow-lg shadow-[#00E676]/20' 
                        : 'bg-[#111A2E] text-slate-400 hover:text-white border border-[#1E2D4A]'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredEvents.map((event) => {
                  const spotsLeft = (event.total_spots || 10) - (event.booked_spots || 0);
                  const isFull = spotsLeft <= 0;
                  const percentFilled = Math.round(((event.booked_spots || 0) / (event.total_spots || 1)) * 100);

                  return (
                    <div key={event.id} className="bg-[#0E1526] border border-[#1A263D] hover:border-[#00E676]/40 rounded-3xl overflow-hidden transition-all duration-300 flex flex-col justify-between group shadow-xl">
                      <div>
                        <div className="relative h-48 overflow-hidden bg-slate-900 cursor-pointer" onClick={() => setDetailModalEvent(event)}>
                          <img src={event.image_url} alt={event.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" />
                          <div className="absolute top-3 left-3 bg-[#0B101D]/90 backdrop-blur-md px-3 py-1 rounded-full text-xs font-bold text-[#00E676] border border-[#00E676]/20">
                            {event.event_type}
                          </div>
                          <div className="absolute top-3 right-3 bg-black/85 backdrop-blur-md px-3 py-1 rounded-full text-xs font-black text-white border border-white/10">
                            {event.price} ETB
                          </div>
                        </div>

                        <div className="p-6 space-y-3">
                          <h3 onClick={() => setDetailModalEvent(event)} className="text-lg font-bold text-white group-hover:text-[#00E676] cursor-pointer transition">
                            {event.title}
                          </h3>
                          <div className="space-y-1 text-xs text-slate-400">
                            <p>📅 <span className="text-slate-200 font-medium">{event.date} • {event.time}</span></p>
                            <p className="truncate">📍 {event.location}</p>
                          </div>
                          <div className="pt-2">
                            <div className="flex justify-between items-center text-xs mb-1.5">
                              <span className={`font-bold ${isFull ? 'text-red-400' : 'text-[#00E676]'}`}>
                                {isFull ? 'Sold Out' : `${spotsLeft} spots available`}
                              </span>
                              <span className="text-slate-400 font-mono text-[11px]">{event.booked_spots || 0}/{event.total_spots} players</span>
                            </div>
                            <div className="w-full h-2 rounded-full bg-[#162032] overflow-hidden">
                              <div className={`h-full rounded-full transition-all duration-500 ${isFull ? 'bg-red-500' : 'bg-[#00E676]'}`} style={{ width: `${percentFilled}%` }}></div>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div className="p-6 pt-0 flex gap-2">
                        <button onClick={() => setDetailModalEvent(event)} className="px-3.5 py-3 rounded-xl bg-[#111A2E] text-slate-300 font-bold text-xs hover:bg-[#16233B] border border-[#1E2D4A]">
                          ℹ️
                        </button>
                        <button 
                          onClick={() => { setSelectedEvent(event); setReceiptFilePreview(null); setBookingModalOpen(true); }}
                          disabled={isFull}
                          className={`flex-1 py-3 rounded-xl font-extrabold text-xs uppercase tracking-wider transition ${isFull ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-[#00E676] text-black hover:bg-[#00c965] shadow-lg shadow-[#00E676]/20'}`}
                        >
                          {isFull ? 'Sold Out' : 'Join Game Now'}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </main>
          )}

          {/* MY PASSES VIEW */}
          {currentView === 'my-tickets' && (
            <main className="flex-1 max-w-4xl mx-auto px-4 sm:px-6 py-10 w-full">
              <div className="flex items-center justify-between mb-8">
                <div>
                  <h2 className="text-3xl font-extrabold text-white">My Match Passes</h2>
                  <p className="text-slate-400 text-sm mt-1">Show your digital pass at the pitch gate.</p>
                </div>
                <button onClick={() => setCurrentView('events')} className="px-4 py-2 bg-[#111A2E] hover:bg-[#16233B] text-slate-300 border border-[#1E2D4A] rounded-xl text-xs font-bold">
                  + Join Another
                </button>
              </div>

              {myBookings.length === 0 ? (
                <div className="p-12 text-center bg-[#0E1526] rounded-3xl border border-[#1A263D] space-y-4">
                  <div className="text-5xl">🎟️</div>
                  <h3 className="text-xl font-bold text-white">No Match Passes Yet</h3>
                  <p className="text-slate-400 text-xs max-w-sm mx-auto">You have not registered for any games yet. Browse matches and reserve your spot.</p>
                  <button onClick={() => setCurrentView('events')} className="px-6 py-3 rounded-xl bg-[#00E676] text-black font-extrabold text-xs uppercase">
                    View Matches
                  </button>
                </div>
              ) : (
                <div className="space-y-4">
                  {myBookings.map((b) => (
                    <div key={b.id} className="bg-[#0E1526] border border-[#1A263D] rounded-3xl p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 shadow-xl">
                      <div className="space-y-2">
                        <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase ${
                          b.status === 'approved' ? 'bg-[#00E676]/20 text-[#00E676] border border-[#00E676]/30' :
                          b.status === 'rejected' ? 'bg-red-500/20 text-red-400 border border-red-500/30' :
                          'bg-amber-400/20 text-amber-400 border border-amber-400/30'
                        }`}>
                          {b.status === 'approved' ? '✓ Verified Pass' : b.status === 'rejected' ? '✕ Payment Rejected' : '⏳ Admin Verification Pending'}
                        </span>
                        <h3 className="text-xl font-extrabold text-white">{b.match_title}</h3>
                        <p className="text-xs text-slate-400">📅 {b.match_date} • {b.match_time} • 📍 {b.match_location}</p>
                        <p className="text-xs text-slate-300">Fee: <strong className="text-[#00E676]">{b.amount} ETB</strong> via {b.payment_method}</p>
                      </div>

                      <button onClick={() => setViewReceiptModal(b.screenshot_url)} className="px-4 py-2 bg-[#111A2E] hover:bg-[#16233B] text-slate-300 font-bold text-xs rounded-xl border border-[#1E2D4A]">
                        View Receipt
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* ADMIN HUB */}
          {currentView === 'admin' && (
            <main className="flex-1 max-w-5xl mx-auto px-4 sm:px-6 py-8 w-full">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                <div>
                  <h2 className="text-3xl font-extrabold text-white">Host Admin Panel 🛡️</h2>
                  <p className="text-slate-400 text-sm">Verify payments or post new pickup games.</p>
                </div>

                <div className="flex bg-[#111A2E] p-1.5 rounded-2xl border border-[#1E2D4A]">
                  <button onClick={() => setAdminTab('approvals')} className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 ${adminTab === 'approvals' ? 'bg-[#00E676] text-black' : 'text-slate-400'}`}>
                    <span>Payment Reviews</span>
                    {pendingCount > 0 && <span className="px-1.5 py-0.5 rounded-full text-[10px] bg-red-600 text-white font-black">{pendingCount}</span>}
                  </button>
                  <button onClick={() => setAdminTab('create')} className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'create' ? 'bg-[#00E676] text-black' : 'text-slate-400'}`}>
                    + Post Match
                  </button>
                  <button onClick={() => setAdminTab('games')} className={`px-4 py-2 rounded-xl text-xs font-bold ${adminTab === 'games' ? 'bg-[#00E676] text-black' : 'text-slate-400'}`}>
                    Manage ({events.length})
                  </button>
                </div>
              </div>

              {adminTab === 'approvals' && (
                <div className="space-y-4">
                  <div className="flex gap-2 pb-2">
                    {['all', 'pending', 'approved', 'rejected'].map(status => (
                      <button key={status} onClick={() => setApprovalFilter(status)} className={`px-3 py-1.5 rounded-xl text-xs font-bold capitalize ${approvalFilter === status ? 'bg-slate-200 text-black' : 'bg-[#111A2E] text-slate-400'}`}>
                        {status}
                      </button>
                    ))}
                  </div>

                  {filteredAdminBookings.map((booking) => (
                    <div key={booking.id} className="bg-[#0E1526] border border-[#1A263D] rounded-2xl p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-2">
                          <h4 className="font-extrabold text-white text-base">{booking.player_name}</h4>
                          <span className="px-2 py-0.5 rounded text-[10px] font-black uppercase bg-[#00E676]/20 text-[#00E676]">{booking.status}</span>
                        </div>
                        <p className="text-xs text-slate-400 font-mono">📞 {booking.player_phone}</p>
                        <p className="text-xs text-slate-300">Match: <strong>{booking.match_title}</strong> • {booking.amount} ETB via {booking.payment_method}</p>
                      </div>

                      <div className="flex items-center gap-4">
                        <img onClick={() => setViewReceiptModal(booking.screenshot_url)} src={booking.screenshot_url} alt="" className="w-14 h-14 object-cover rounded-xl border border-[#1E2D4A] cursor-pointer hover:border-[#00E676]" />
                        {booking.status === 'pending' ? (
                          <div className="flex gap-2">
                            <button onClick={() => handleUpdatePaymentStatus(booking.id, booking.event_id, 'approved')} className="px-4 py-2 bg-[#00E676] text-black font-extrabold text-xs rounded-xl">Approve ✓</button>
                            <button onClick={() => handleUpdatePaymentStatus(booking.id, booking.event_id, 'rejected')} className="px-3 py-2 bg-red-500/20 text-red-400 font-bold text-xs rounded-xl border border-red-500/30">Reject ✕</button>
                          </div>
                        ) : (
                          <span className="text-xs text-slate-400">Done ({booking.status})</span>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {adminTab === 'create' && (
                <div className="bg-[#0E1526] border border-[#1A263D] rounded-3xl p-6 md:p-8">
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const createdMatch = {
                      id: Date.now().toString(),
                      title: form.title.value,
                      event_type: form.event_type.value,
                      date: form.date.value,
                      time: form.time.value,
                      location: form.location.value,
                      price: Number(form.price.value),
                      total_spots: Number(form.total_spots.value),
                      booked_spots: 0,
                      image_url: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=700",
                      description: form.description.value || "Friendly pickup game.",
                      amenities: ["Artificial Turf", "Bibs Provided", "Water"]
                    };
                    setEvents([createdMatch, ...events]);
                    showToast("⚽ Match posted!");
                    setAdminTab('games');
                  }} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="md:col-span-2">
                      <label className="text-xs font-bold uppercase text-slate-400 block mb-1">Match Title</label>
                      <input name="title" type="text" placeholder="e.g. 5-a-side Bole Atlas Night Game" required className="w-full px-4 py-3 rounded-xl bg-[#090D18] border border-[#1E2D4A] text-white text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold uppercase text-slate-400 block mb-1">Format</label>
                      <select name="event_type" className="w-full px-4 py-3 rounded-xl bg-[#090D18] border border-[#1E2D4A] text-white text-xs">
                        <option value="5-a-side">5-a-side</option>
                        <option value="7-a-side">7-a-side</option>
                        <option value="Full Field">Full Field (11v11)</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold uppercase text-slate-400 block mb-1">Price (ETB)</label>
                      <input name="price" type="number" defaultValue={150} required className="w-full px-4 py-3 rounded-xl bg-[#090D18] border border-[#1E2D4A] text-white text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold uppercase text-slate-400 block mb-1">Date</label>
                      <input name="date" type="text" defaultValue="Today" required className="w-full px-4 py-3 rounded-xl bg-[#090D18] border border-[#1E2D4A] text-white text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold uppercase text-slate-400 block mb-1">Time</label>
                      <input name="time" type="text" defaultValue="5:30 PM - 7:00 PM" required className="w-full px-4 py-3 rounded-xl bg-[#090D18] border border-[#1E2D4A] text-white text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold uppercase text-slate-400 block mb-1">Spots Capacity</label>
                      <input name="total_spots" type="number" defaultValue={10} required className="w-full px-4 py-3 rounded-xl bg-[#090D18] border border-[#1E2D4A] text-white text-xs" />
                    </div>
                    <div>
                      <label className="text-xs font-bold uppercase text-slate-400 block mb-1">Pitch Location</label>
                      <input name="location" type="text" placeholder="e.g. Bole Atlas Pitch, Addis Ababa" required className="w-full px-4 py-3 rounded-xl bg-[#090D18] border border-[#1E2D4A] text-white text-xs" />
                    </div>
                    <div className="md:col-span-2">
                      <label className="text-xs font-bold uppercase text-slate-400 block mb-1">Rules / Info</label>
                      <textarea name="description" rows="2" placeholder="Turf boots only, no metal studs." className="w-full px-4 py-3 rounded-xl bg-[#090D18] border border-[#1E2D4A] text-white text-xs"></textarea>
                    </div>
                    <div className="md:col-span-2 pt-2">
                      <button type="submit" className="w-full py-4 rounded-2xl bg-[#00E676] text-black font-extrabold text-xs uppercase hover:bg-[#00c965]">Publish Live</button>
                    </div>
                  </form>
                </div>
              )}

              {adminTab === 'games' && (
                <div className="space-y-4">
                  {events.map((ev) => (
                    <div key={ev.id} className="bg-[#0E1526] border border-[#1A263D] rounded-2xl p-5 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                      <div>
                        <h4 className="font-extrabold text-white text-base">{ev.title}</h4>
                        <p className="text-xs text-slate-400">📅 {ev.date} • {ev.time} • 📍 {ev.location}</p>
                        <p className="text-xs text-[#00E676] font-bold mt-1">{ev.booked_spots || 0}/{ev.total_spots} Spots Filled ({ev.price} ETB)</p>
                      </div>
                      <button onClick={() => handleDeleteMatch(ev.id)} className="px-3 py-2 bg-red-500/20 text-red-400 text-xs font-bold rounded-xl border border-red-500/30">Delete</button>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}

          {/* PROFILE VIEW */}
          {currentView === 'profile' && (
            <main className="flex-1 max-w-xl mx-auto px-4 sm:px-6 py-10 w-full">
              <div className="bg-[#0E1526] border border-[#1A263D] rounded-3xl p-8 text-center relative overflow-hidden shadow-2xl">
                <div className="absolute top-0 inset-x-0 h-32 bg-gradient-to-r from-emerald-600/30 to-[#00E676]/20" />
                <div className="relative pt-8 flex flex-col items-center">
                  <div className="relative mb-4">
                    <img src={userProfile.avatar} alt="Profile" className="w-28 h-28 rounded-full border-4 border-[#0E1526] object-cover shadow-2xl" />
                    <label className="absolute bottom-1 right-1 p-2 bg-[#00E676] text-black rounded-full cursor-pointer hover:scale-110 transition shadow-lg text-xs">
                      📷
                      <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, (dataUrl) => setUserProfile(prev => ({ ...prev, avatar: dataUrl })))} className="hidden" />
                    </label>
                  </div>

                  <h2 className="text-2xl font-extrabold text-white">{userProfile.name}</h2>
                  <p className="text-xs text-slate-400 font-mono mt-0.5">{userProfile.phone}</p>
                  
                  <div className="flex gap-2 mt-3">
                    <span className="px-3 py-1 rounded-full text-[11px] font-bold bg-[#111A2E] text-slate-300 border border-[#1E2D4A]">⚽ {userProfile.position}</span>
                    <span className="px-3 py-1 rounded-full text-[11px] font-bold bg-[#111A2E] text-slate-300 border border-[#1E2D4A]">📍 {userProfile.neighborhood}</span>
                  </div>

                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    setUserProfile(prev => ({
                      ...prev,
                      name: form.p_name.value,
                      phone: form.p_phone.value,
                      position: form.p_pos.value,
                      neighborhood: form.p_area.value
                    }));
                    showToast("Profile details saved!");
                  }} className="w-full mt-6 text-left space-y-3">
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">Full Name</label>
                      <input name="p_name" type="text" defaultValue={userProfile.name} className="w-full px-3 py-2 rounded-xl bg-[#080D1A] border border-[#1E2D4A] text-white text-xs" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">Phone Number</label>
                      <input name="p_phone" type="text" defaultValue={userProfile.phone} className="w-full px-3 py-2 rounded-xl bg-[#080D1A] border border-[#1E2D4A] text-white text-xs" />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">Position</label>
                        <select name="p_pos" defaultValue={userProfile.position} className="w-full px-3 py-2 rounded-xl bg-[#080D1A] border border-[#1E2D4A] text-white text-xs">
                          <option value="Striker">Striker</option>
                          <option value="Midfielder">Midfielder</option>
                          <option value="Defender">Defender</option>
                          <option value="Goalkeeper">Goalkeeper</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] font-bold uppercase text-slate-400 block mb-1">Subcity</label>
                        <input name="p_area" type="text" defaultValue={userProfile.neighborhood} className="w-full px-3 py-2 rounded-xl bg-[#080D1A] border border-[#1E2D4A] text-white text-xs" />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2.5 mt-2 bg-[#00E676] text-black font-extrabold text-xs rounded-xl hover:bg-[#00c965]">Save Changes</button>
                  </form>
                </div>
              </div>
            </main>
          )}

          {/* BOOKING MODAL */}
          {bookingModalOpen && selectedEvent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="bg-[#0E1526] border border-[#1A263D] w-full max-w-lg rounded-3xl p-6 sm:p-8 space-y-6 max-h-[90vh] overflow-y-auto shadow-2xl">
                <div className="flex justify-between items-start border-b border-[#1A263D] pb-4">
                  <div>
                    <h4 className="font-extrabold text-xl text-white">Confirm Spot Registration</h4>
                    <p className="text-xs text-[#00E676] font-semibold mt-0.5">{selectedEvent.title}</p>
                    <p className="text-xs text-slate-400">📅 {selectedEvent.date} • {selectedEvent.time}</p>
                  </div>
                  <button onClick={() => setBookingModalOpen(false)} className="text-slate-400 hover:text-white font-bold text-xl leading-none p-1">✕</button>
                </div>

                <form onSubmit={handleClientBookingSubmit} className="space-y-5">
                  <div className="bg-[#080D1A] p-4 rounded-2xl flex justify-between items-center border border-[#1E2D4A]">
                    <span className="text-xs text-slate-300 font-semibold">Amount to Pay:</span>
                    <span className="text-[#00E676] font-black text-lg">{selectedEvent.price} ETB</span>
                  </div>

                  <div>
                    <label className="text-xs font-bold uppercase text-slate-400 block mb-2">Choose Mobile Banking</label>
                    <div className="grid grid-cols-2 gap-3">
                      {['Telebirr', 'CBE'].map((m) => (
                        <button
                          type="button"
                          key={m}
                          onClick={() => setPaymentMethod(m)}
                          className={`py-3 rounded-2xl text-xs font-extrabold border transition ${paymentMethod === m ? 'bg-[#00E676]/20 border-[#00E676] text-[#00E676]' : 'bg-[#111A2E] border-[#1E2D4A] text-slate-400'}`}
                        >
                          {m === 'Telebirr' ? '📱 Telebirr' : '🏦 CBE / CBE Birr'}
                        </button>
                      ))}
                    </div>

                    <div className="p-4 rounded-2xl bg-[#111A2E] border border-[#1E2D4A] mt-3 space-y-2">
                      <div className="flex justify-between items-center">
                        <div>
                          <p className="text-[10px] uppercase font-bold text-slate-400">Transfer To:</p>
                          <p className="font-mono text-white text-base font-bold">{PAYMENT_INFO[paymentMethod].displayName}</p>
                        </div>
                        <button type="button" onClick={() => handleCopyText(PAYMENT_INFO[paymentMethod].accountNumber, paymentMethod)} className="px-3 py-1.5 bg-[#00E676] hover:bg-[#00c965] text-black font-extrabold text-xs rounded-xl transition">
                          Copy Number
                        </button>
                      </div>
                      <p className="text-[11px] text-slate-400 pt-1 border-t border-[#1E2D4A]/60">Account Holder: <strong className="text-slate-200">{PAYMENT_INFO[paymentMethod].receiver}</strong></p>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <label className="text-xs font-bold uppercase text-slate-400 block">Upload Transfer Screenshot (Required)</label>
                    <label className="border-2 border-dashed border-[#1E2D4A] hover:border-[#00E676] rounded-2xl p-5 flex flex-col items-center justify-center cursor-pointer transition bg-[#080D1A]">
                      {receiptFilePreview ? (
                        <div className="flex items-center gap-3">
                          <img src={receiptFilePreview} alt="" className="w-14 h-14 object-cover rounded-xl border border-[#00E676]" />
                          <div className="text-left">
                            <p className="text-xs text-[#00E676] font-bold">Screenshot Attached ✓</p>
                            <p className="text-[10px] text-slate-400">Click to change</p>
                          </div>
                        </div>
                      ) : (
                        <>
                          <span className="text-3xl mb-1">📤</span>
                          <span className="text-xs font-bold text-slate-200">Tap to select receipt photo</span>
                          <span className="text-[10px] text-slate-500">JPG or PNG screenshot</span>
                        </>
                      )}
                      <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, setReceiptFilePreview)} className="hidden" required={!receiptFilePreview} />
                    </label>
                  </div>

                  <button type="submit" disabled={isSubmittingBooking} className="w-full py-4 rounded-2xl bg-[#00E676] text-black font-extrabold text-xs uppercase hover:bg-[#00c965] shadow-xl shadow-[#00E676]/25 transition">
                    {isSubmittingBooking ? 'Submitting...' : 'Send Receipt & Confirm Spot'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* DETAIL MODAL */}
          {detailModalEvent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="bg-[#0E1526] border border-[#1A263D] w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl space-y-4">
                <div className="relative h-56">
                  <img src={detailModalEvent.image_url} alt="" className="w-full h-full object-cover" />
                  <button onClick={() => setDetailModalEvent(null)} className="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/70 text-white flex items-center justify-center font-bold">✕</button>
                  <div className="absolute bottom-3 left-3 bg-[#00E676] text-black text-xs font-black px-3 py-1 rounded-full">{detailModalEvent.event_type}</div>
                </div>

                <div className="p-6 pt-0 space-y-4">
                  <div>
                    <h3 className="text-xl font-extrabold text-white">{detailModalEvent.title}</h3>
                    <p className="text-xs text-[#00E676] font-semibold mt-0.5">📍 {detailModalEvent.location}</p>
                    <p className="text-xs text-slate-400">⏰ {detailModalEvent.date} • {detailModalEvent.time}</p>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">{detailModalEvent.description}</p>
                  <div className="flex items-center justify-between pt-4 border-t border-[#1E2D4A]">
                    <div>
                      <span className="text-slate-400 text-xs block">Fee per Player</span>
                      <span className="text-2xl font-black text-white">{detailModalEvent.price} ETB</span>
                    </div>
                    <button onClick={() => { setSelectedEvent(detailModalEvent); setDetailModalEvent(null); setBookingModalOpen(true); }} className="px-6 py-3 rounded-xl bg-[#00E676] text-black font-extrabold text-xs uppercase hover:bg-[#00c965]">
                      Join Game
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* RECEIPT ZOOM MODAL */}
          {viewReceiptModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
              <div className="relative max-w-lg w-full bg-[#0E1526] p-4 rounded-3xl border border-[#1A263D] space-y-3">
                <div className="flex justify-between items-center pb-2 border-b border-[#1A263D]">
                  <h4 className="font-extrabold text-white text-sm">Payment Receipt Verification</h4>
                  <button onClick={() => setViewReceiptModal(null)} className="text-slate-400 hover:text-white font-bold text-lg">✕</button>
                </div>
                <div className="max-h-[75vh] overflow-auto rounded-2xl bg-black/50 p-2">
                  <img src={viewReceiptModal} alt="Receipt Full Zoom" className="w-full object-contain rounded-xl" />
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
